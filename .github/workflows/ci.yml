name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The recognizer tests need a quantized model, far too large to fetch in
      # CI, so they skip. The frontend tests run against committed golden
      # vectors and cover the part most likely to regress silently: a wrong
      # window or filterbank produces plausible output rather than an error.
      - run: swift build -v
      - run: swift test -v

  ios:
    name: Build for iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Printed so a missing platform is obvious in the log rather than
      # surfacing as "Unable to find a destination matching...".
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || echo "NO iOS SDK"

      - name: Build
        run: |
          xcodebuild build \
            -scheme Vaani \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  docs:
    name: Build documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || echo "NO iOS SDK"

      # Built for iOS deliberately: ONNX Runtime's Objective-C headers include
      # C++ that clang cannot parse when extracting macOS symbol graphs, so a
      # macOS docs build fails inside the dependency.
      - name: DocC
        run: |
          xcodebuild docbuild \
            -scheme Vaani \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
