name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: swift build -v

      # The recognizer tests need a quantized model, which is far too large to
      # fetch in CI, so they skip. The frontend tests run against committed
      # golden vectors and cover the part most likely to regress silently.
      - name: Test
        run: swift test -v

  ios:
    name: Build for iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: |
          xcodebuild build \
            -scheme Vaani \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  docs:
    name: Build documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: DocC
        run: |
          xcodebuild docbuild \
            -scheme Vaani \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
