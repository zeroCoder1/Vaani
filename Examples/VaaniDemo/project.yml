name: VaaniDemo
options:
  bundleIdPrefix: com.vaani
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

# The demo builds Vaani from source as its own framework target rather than
# referencing the repo root as a local package. Referencing ../.. made Xcode
# treat the whole repo (including .venv and models/, ~5GB) as package contents,
# and broke whenever the repo folder was also open. Third-party integration
# over SPM is verified separately by Tests and by tools/check-integration.sh.
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.24.2"

schemes:
  VaaniDemo:
    build:
      targets:
        VaaniDemo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Vaani:
    type: framework
    platform: iOS
    sources:
      - path: ../../Sources/Vaani
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaani.framework
        PRODUCT_NAME: Vaani
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

  VaaniDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../Fixtures
        buildPhase: resources
        name: Fixtures
        includes: ["*.wav", "samples.json"]
      # Benchmark audio is not committed; run tools/fetch_benchmark_clips.py.
      # optional so the demo still builds without it.
      - path: ../../Fixtures/benchmark
        buildPhase: resources
        name: Benchmark
        optional: true
        includes: ["*.wav", "benchmark.json"]
    dependencies:
      - target: Vaani
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaani.demo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        # Signing. Simulator builds need nothing. For a device, either pick your
        # team in Xcode's Signing tab, or export DEVELOPMENT_TEAM before running
        # xcodegen. Left empty here so a fresh clone is not tied to one account.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic

        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vaani
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record speech to transcribe on device."
        # Fetching the model from a dev server on your LAN triggers the iOS 14+
        # local-network prompt; without this the app is denied silently.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Download the speech model from a development server on your network."

        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # ~900MB of weights exceeds the default memory cap on 8GB devices.
        CODE_SIGN_ENTITLEMENTS: VaaniDemo.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Info.plist
      properties:
        # ATS blocks plain HTTP. localhost is exempt, a LAN IP is not, so a dev
        # server at http://192.168.x.x fails without this. It permits local
        # networking only - it does not disable ATS for the public internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
